version: 2
updates:
  - package-ecosystem: gradle
    ignore:
      - dependency-name: "io.github.libxposed:*"
        update-types: ["version-update:semver-major"]
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    commit-message:
      prefix: "ci(deps)"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    commit-message:
      prefix: "ci(deps)"
