version: 2
updates:
  - package-ecosystem: gradle
    ignore:
      - dependency-name: "io.github.libxposed:api"
        versions: [">=102"]
      - dependency-name: "io.github.libxposed:service"
        versions: [">=102"]
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    commit-message:
      prefix: "ci(deps)"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    commit-message:
      prefix: "ci(deps)"
