name: CI

on:
  pull_request:
  push:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: gradle/actions/wrapper-validation@v6.3.0

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Check and build
        run: ./gradlew :app:ktlintCheck :app:testDebugUnitTest :app:assembleDebug :app:lintRelease

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Test the release detector
        working-directory: tools
        run: python3 -m unittest discover -p 'test_*.py' -v

      - name: Check the compatibility tables
        run: |
          python3 -m pip install --quiet pyyaml
          curl -fsSL -o "$RUNNER_TEMP/mirror-README.md" \
            https://raw.githubusercontent.com/Xposed-Modules-Repo/eu.hxreborn.gplayadblock/main/README.md
          python3 tools/check_compat_tables.py play-store-compatibility.yaml \
            README.md "$RUNNER_TEMP/mirror-README.md"
