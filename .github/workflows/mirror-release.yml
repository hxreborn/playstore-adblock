name: Mirror to Xposed-Modules-Repo

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to mirror (e.g., v1.0.0)'
        required: true

concurrency:
  group: mirror-release
  cancel-in-progress: false

jobs:
  mirror:
    if: github.event_name == 'workflow_dispatch' || !github.event.release.prerelease
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      TAG_NAME: ${{ inputs.tag || github.event.release.tag_name }}

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Validate tag
        run: |
          if [[ ! "$TAG_NAME" =~ ^v ]]; then
            echo "::error::Tag must start with 'v'"
            exit 1
          fi

      - name: Derive mirror tag
        id: mirror_tag
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          name=${TAG_NAME#v}
          code=$(gh api "repos/$REPO/contents/gradle.properties?ref=$TAG_NAME" --jq '.content' \
            | base64 -d | grep '^version\.code=' | cut -d= -f2)
          [[ "$code" =~ ^[0-9]+$ ]] || { echo "::error::no version.code at $TAG_NAME"; exit 1; }
          echo "mirror_tag=${code}-${name}" >> "$GITHUB_OUTPUT"
          echo "version_code=${code}" >> "$GITHUB_OUTPUT"

      - name: Fetch release info
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          gh release view "$TAG_NAME" --repo "$REPO" --json name,isPrerelease \
            --jq '"name=\(.name)\nprerelease=\(.isPrerelease)"' >> "$GITHUB_OUTPUT"

          echo "body<<BODY_EOF" >> "$GITHUB_OUTPUT"
          gh release view "$TAG_NAME" --repo "$REPO" --json body --jq '.body' >> "$GITHUB_OUTPUT"
          echo "BODY_EOF" >> "$GITHUB_OUTPUT"

      - name: Download APKs from release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          version=${TAG_NAME#v}
          mkdir -p ./artifacts
          assets=$(gh release view "$TAG_NAME" --repo "$REPO" --json assets --jq '.assets[].name')
          selected=$(python3 tools/check_release_assets.py select "$version" <<<"$assets")
          while IFS= read -r asset; do
            gh release download "$TAG_NAME" --repo "$REPO" --pattern "$asset" --dir ./artifacts
          done <<<"$selected"

      - name: Validate APKs
        env:
          VERSION_CODE: ${{ steps.mirror_tag.outputs.version_code }}
        run: |
          build_tools=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          python3 tools/check_release_assets.py verify "${TAG_NAME#v}" "$VERSION_CODE" ./artifacts \
            --build-tools "$build_tools"

      - name: Tag the mirror head
        env:
          GH_TOKEN: ${{ secrets.XPOSED_REPO_PAT }}
          MIRROR_TAG: ${{ steps.mirror_tag.outputs.mirror_tag }}
        run: |
          git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/Xposed-Modules-Repo/eu.hxreborn.gplayadblock.git" mirror
          cd mirror
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$MIRROR_TAG" -m "$MIRROR_TAG"
          git push origin "$MIRROR_TAG"

      - name: Create mirror release
        uses: softprops/action-gh-release@v3
        with:
          repository: Xposed-Modules-Repo/eu.hxreborn.gplayadblock
          token: ${{ secrets.XPOSED_REPO_PAT }}
          tag_name: ${{ steps.mirror_tag.outputs.mirror_tag }}
          name: ${{ steps.release.outputs.name }}
          body: ${{ steps.release.outputs.body }}
          prerelease: ${{ steps.release.outputs.prerelease }}
          files: ./artifacts/*.apk
          fail_on_unmatched_files: true
          make_latest: true
