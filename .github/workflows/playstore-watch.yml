name: Play Store version watch

# Scheduled runs live on the infra container at /root/scripts/playstore-watch.sh.
# This workflow stays manual so the channel cannot receive duplicate notices.
on:
  workflow_dispatch:
    inputs:
      test_notification:
        description: "Send a clearly marked test notification without waiting for a new version"
        type: boolean
        default: false
      dry_run:
        description: "Print the notification instead of sending it"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  SOURCE_URL: https://apkcombo.com/google-play-store/com.android.vending/old-versions/
  PROJECT_URL: https://github.com/hxreborn/playstore-adblock
  REPORT_URL: https://github.com/hxreborn/playstore-adblock/issues

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - id: check
        name: Check latest Play Store version
        run: |
          set -euo pipefail
          if ! html=$(curl -sS --fail-with-body \
              --max-time 30 --retry 3 --retry-delay 5 --retry-all-errors \
              -A "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36" \
              "$SOURCE_URL"); then
            echo "::error::Could not download $SOURCE_URL"
            exit 1
          fi
          version=$(printf '%s' "$html" \
            | grep -oE '\b[0-9]{2,3}\.[0-9]+\.[0-9]+\b' \
            | sort -V -u | tail -1 || true)
          if [ -z "$version" ]; then
            echo "::error::Could not determine the latest Play Store version. The source page may have changed."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "detected=$(LC_ALL=C date -u '+%-d %B %Y')" >> "$GITHUB_OUTPUT"
          echo "Detected Play Store version: $version"

      - id: state
        name: Restore notification state
        uses: actions/cache@v4
        with:
          path: .playstore-seen
          key: playstore-seen-${{ steps.check.outputs.version }}

      - name: Notify about new version
        env:
          TG_TOKEN: ${{ secrets.TG_WATCH_TOKEN }}
          TG_CHAT: ${{ secrets.TG_WATCH_CHAT }}
          VERSION: ${{ steps.check.outputs.version }}
          DETECTED: ${{ steps.check.outputs.detected }}
          SEEN: ${{ steps.state.outputs.cache-hit }}
          IS_TEST: ${{ inputs.test_notification }}
          IS_DRY: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          if [ "$SEEN" = "true" ] && [ "$IS_TEST" != "true" ]; then
            echo "No notification required; version already seen."
            exit 0
          fi

          header="New Play Store Version Detected!"
          if [ "$IS_TEST" = "true" ]; then
            header="Test notification. New Play Store Version Detected!"
          fi

          text=$(printf '%s\n\nVersion: %s\nPackage: com.android.vending\nDetected: %s\nSource: %s\nCompatibility: Not yet verified with Play Store Adblock\n\n%s\n\n%s\n\nReport: %s\n\n%s\n' \
            "$header" \
            "$VERSION" \
            "$DETECTED" \
            "$SOURCE_URL" \
            "A new version name has appeared in the monitored APK index. Google may distribute multiple builds and version codes under the same version name." \
            "If sponsored content reappears after this update, report it with the full version string from Play Store Settings > About. Verified builds are listed at $PROJECT_URL#verified-builds." \
            "$REPORT_URL" \
            "This is an availability notice, not an incompatibility warning.")

          if [ "$IS_DRY" = "true" ]; then
            echo "Dry run. The notification would be:"
            printf '%s\n' "$text"
            exit 0
          fi

          if [ -z "${TG_TOKEN:-}" ] || [ -z "${TG_CHAT:-}" ]; then
            echo "::error::TG_TOKEN or TG_CHAT is not configured."
            exit 1
          fi

          curl -sS --fail-with-body \
            --max-time 20 --retry 3 --retry-delay 5 --retry-all-errors \
            "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            -d chat_id="$TG_CHAT" \
            -d disable_web_page_preview=true \
            --data-urlencode text="$text" > /dev/null

          printf '%s' "$VERSION" > .playstore-seen
          echo "Notification sent for Play Store $VERSION."
