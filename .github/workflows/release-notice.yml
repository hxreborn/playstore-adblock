name: Telegram release notice

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to announce (e.g., v1.0.0)'
        required: true
      dry_run:
        description: 'Print the notification instead of sending it'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-notice
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    env:
      TAG_NAME: ${{ inputs.tag || github.event.release.tag_name }}

    steps:
      - name: Validate tag
        run: |
          if [[ ! "$TAG_NAME" =~ ^v ]]; then
            echo "::error::Tag must start with 'v'"
            exit 1
          fi

      - name: Fetch release info
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          gh release view "$TAG_NAME" --repo "$REPO" --json url --jq '"url=\(.url)"' >> "$GITHUB_OUTPUT"

          gh release view "$TAG_NAME" --repo "$REPO" --json assets \
            --jq '.assets[] | select(.name | test("^playstore-adblock-v.*-arm64-v8a\\.apk$")) | "apk_name=\(.name)\napk_url=\(.url)"' \
            >> "$GITHUB_OUTPUT"

          delim="BODY_EOF_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
          echo "body<<$delim" >> "$GITHUB_OUTPUT"
          gh release view "$TAG_NAME" --repo "$REPO" --json body --jq '.body' >> "$GITHUB_OUTPUT"
          echo "$delim" >> "$GITHUB_OUTPUT"

      - name: Notify about release
        env:
          TG_TOKEN: ${{ secrets.TG_WATCH_TOKEN }}
          TG_CHAT: ${{ secrets.TG_WATCH_CHAT }}
          BODY: ${{ steps.release.outputs.body }}
          RELEASE_URL: ${{ steps.release.outputs.url }}
          APK_NAME: ${{ steps.release.outputs.apk_name }}
          APK_URL: ${{ steps.release.outputs.apk_url }}
          IS_DRY: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail

          html_escape() {
            printf '%s' "$1" | sed 's/&/\&amp;/g; s/</\&lt;/g; s/>/\&gt;/g'
          }

          first_line="${BODY%%$'\n'*}"
          compare_url=$(printf '%s' "$first_line" | sed -nE 's/^## \[[^]]*\]\(([^)]*)\).*/\1/p')
          [ -z "$compare_url" ] && compare_url="$RELEASE_URL"
          compare_url_esc=$(html_escape "$compare_url")
          tag_esc=$(html_escape "$TAG_NAME")
          apk_name_esc=$(html_escape "$APK_NAME")
          apk_url_esc=$(html_escape "$APK_URL")

          esc=$(printf '%s\n' "$BODY" | tr -d '\r' \
            | sed -E 's/&/\&amp;/g; s/</\&lt;/g; s/>/\&gt;/g')

          declare -A emoji=(
            ["Features"]="✨" ["Bug Fixes"]="🐛" ["Performance Improvements"]="⚡"
            ["Security"]="🔒" ["Refactor"]="♻️" ["Reverts"]="⏪" ["Tests"]="🧪"
            ["Build System"]="🧱"
          )

          declare -A groups
          order=()
          section="_none_"
          count=0
          cap=6
          while IFS= read -r line; do
            if [[ "$line" =~ ^###[[:space:]]+(.*)$ ]]; then
              section="${BASH_REMATCH[1]:-_none_}"
              continue
            fi
            if [[ "$line" =~ ^\*[[:space:]]+(.*)$ ]]; then
              if [ "$count" -ge "$cap" ]; then
                count=$((count + 1))
                continue
              fi
              desc="${BASH_REMATCH[1]}"
              desc=$(printf '%s' "$desc" \
                | sed -E 's/ \(\[[0-9a-f]{7}\]\([^)]*\)\)//g' \
                | sed -E 's|\[([^]]*)\]\(([^)]*)\)|<a href="\2">\1</a>|g' \
                | sed -E 's|\*\*([^*]*)\*\*|<code>\1</code>|g')
              if [[ -z "${groups[$section]+x}" ]]; then
                order+=("$section")
                groups[$section]=""
              fi
              groups[$section]+=$'\n'"• $desc"
              count=$((count + 1))
            fi
          done <<< "$esc"

          shown=""
          for section in "${order[@]}"; do
            e="${emoji[$section]:-}"
            shown+=$'\n'"<blockquote>${e:+$e }<b>${section}</b>${groups[$section]}</blockquote>"$'\n'
          done
          shown="${shown#$'\n'}"
          shown="${shown%$'\n'}"
          total=$count

          text="<b>New stable release</b>"$'\n\n'"<b>Play Store Adblock ${tag_esc}</b>"
          if [ -n "$shown" ]; then
            text+=$'\n\n'"$shown"
            if [ "$total" -gt "$cap" ]; then
              text+=$'\n'"…and $((total - cap)) more"
            fi
          fi
          text+=$'\n\n'"<a href=\"${compare_url_esc}\">See full changelog</a>"
          if [ -n "$APK_URL" ]; then
            text+=$'\n\n'"<b>Download</b>"$'\n'"📦 <a href=\"${apk_url_esc}\">${apk_name_esc}</a>"
          fi

          if [ "$IS_DRY" = "true" ]; then
            echo "Dry run. The notification would be:"
            printf '%s\n' "$text"
            exit 0
          fi

          if [ -z "${TG_TOKEN:-}" ] || [ -z "${TG_CHAT:-}" ]; then
            echo "::error::TG_TOKEN or TG_CHAT is not configured."
            exit 1
          fi

          # Retries can double-post
          curl -sS --fail-with-body --max-time 20 \
            "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            -d chat_id="$TG_CHAT" \
            -d parse_mode=HTML \
            -d disable_web_page_preview=true \
            --data-urlencode text="$text" > /dev/null

          echo "Notification sent for $TAG_NAME."
