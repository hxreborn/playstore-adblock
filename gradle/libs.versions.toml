[versions]
aboutlibraries = "15.3.0"
activityCompose = "1.13.0"
agp = "9.5.1"
composeBom = "2026.09.00"
composePreferences = "2.2.0"
dexkit = "2.3.0"
json = "20260814"
kotlin = "2.4.21"
kotlinxCoroutines = "1.11.0"
junit = "4.13.2"
ktlint = "1.8.0"
libxposedApi = "101.0.1"
